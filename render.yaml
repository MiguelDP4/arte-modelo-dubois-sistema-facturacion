services:
  - type: web
    name: arte-modelo-dubois-api
    env: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build:shared && npm run db:postgres:generate --workspace=apps/api && npm run build:api
    startCommand: npm run db:postgres:push --workspace=apps/api && npm run db:seed:permissions --workspace=apps/api && npm run start --workspace=apps/api
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: '"Arte Modelo Dubois" <no-reply@artemodelodubois.gt>'
      - key: RESEND_API_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: arte-modelo-dubois-assets
      - key: R2_PUBLIC_URL
        sync: false
